name: 發布預排文章

on:
  schedule:
    # 每天 01:05 UTC（台灣時間 09:05）重新建置 GitHub Pages。
    - cron: "5 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request-pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: 重新建置 GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              headers: {
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
